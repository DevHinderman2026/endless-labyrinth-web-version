<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Play Endless Labyrinth</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Endless Labyrinth">
  <meta name="theme-color" content="#0c0f14">
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="game">
  <main id="stage">
    <div id="intro">
      <h1>Endless Labyrinth</h1>
      <p id="lead">Wear headphones. Press Start to load the game's sounds. The game will then ask you to turn your screen reader off while you play.</p>
      <p><button id="start" class="button" type="button">Start</button></p>
      <p id="progress"></p>
      <p id="windows-note" hidden>For the other modes on Windows: <a href="https://github.com/DevHinderman2026/Endless-Labyrinth/releases/latest">download the latest Windows version of Endless Labyrinth</a>.</p>
      <p><a href="index.html">Back to the home page</a></p>
    </div>
    <p id="status"></p>
    <p id="said"></p>
    <!-- Windows (web 2.1.0): the game keeps the keyboard focus here, so NVDA and
         JAWS stay in focus mode and every key reaches the game; what the game says
         is written here too, for a Braille display (js/braille.js). Hidden until a
         Windows computer starts the game. -->
    <textarea id="console" class="console" aria-label="Endless Labyrinth" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false" hidden></textarea>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>

  <title>Play Endless Labyrinth</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

<body class="game">
  <main id="stage">
    <div id="intro">
      <h1>Endless Labyrinth</h1>
      <p id="lead">Wear headphones. Press Start to load the game's sounds. The game will then ask you to turn your screen reader off while you play.</p>
      <p><button id="start" class="button" type="button">Start</button></p>
      <p id="progress"></p>
      <p id="windows-note" hidden>For the other modes on Windows: <a href="https://github.com/DevHinderman2026/Endless-Labyrinth/releases/latest">download the latest Windows version of Endless Labyrinth</a>.</p>
      <p><a href="index.html">Back to the home page</a></p>
    </div>
    <p id="status"></p>
    <p id="said"></p>
    <!-- Windows (web 3.0.0, a game area since 3.2.0): the game keeps the keyboard
         focus here, so NVDA and JAWS stay in focus mode and every key reaches the
         game; what the game says becomes its name, for a Braille display
         (js/braille.js). Not a text box: in an editable field the screen reader
         holds Braille keys until the space. Hidden until a Windows computer starts
         the game. -->
    <div id="console" class="console" role="application" tabindex="0" aria-label="Endless Labyrinth" hidden>Endless Labyrinth</div>
  </main>

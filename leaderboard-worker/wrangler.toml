# The weekly leaderboard's relay (web 7.2.0). See README.md in this folder.
name = "el-leaderboard"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
SCORES_REPO = "DevHinderman2026/Endless-Labyrinth-score-leaderboard"
ALLOWED_ORIGINS = "https://devhinderman2026.github.io"
MAX_PER_MINUTE = "2000"
MIN_GAP = "20"
# GITHUB_TOKEN is a secret: set it in the Cloudflare dashboard (Settings, Variables and Secrets), never here.
